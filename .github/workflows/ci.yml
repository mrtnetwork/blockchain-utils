name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --features hw

  kats-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci_kats.sh

  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: lib tests
        run: cargo test --lib --features hw
      - name: kats
        run: cargo test --test kats --features hw
      - name: diff
        run: cargo test --test diff --features hw
      - name: hw
        run: cargo test --test hw --features hw
      - name: dkls23
        run: cargo test --test dkls23 --features hw
      - name: benches (compat)
        run: cargo test --test benches --features hw,groth16-prover
